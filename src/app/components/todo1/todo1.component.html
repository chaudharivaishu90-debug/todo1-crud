
<h1 class="text-center bg-dark text-white mt-2">
  Todo Crud
</h1>

<div class="container-fluid mt-5">
  <div class="row">

    <div class="col-md-6">
      <div class="form-group">

        <label for="todoname">Enter Todo</label>

        <input
          type="text"
          class="form-control"
          id="todoname"
          #todoname
        >

        <div class="mt-2">

          <button
            (click)="onAddtodo()"
            mat-raised-button
            color="primary"
            *ngIf="!IsinEditMode"
            class="btn btn-block">
            Add Todo
          </button>

          <button
            mat-raised-button
            color="warn"
            *ngIf="IsinEditMode"
            class="btn btn-block"
            (click)="onUpdatetodo()">
            Update Todo
          </button>

        </div>
      </div>
    </div>

    <div class="col-md-6">

      <ul
        class="list-group"
        *ngIf="todoarr.length > 0; else notodo">

        <li
          class="list-group-item d-flex justify-content-between align-items-center"
          *ngFor="let todo of todoarr trackBy:trackById">

          <strong>{{todo.todoname}}</strong>

          <div>

            <button
              mat-mini-fab
              color="primary"
              class="me-4"
              (click)="onEditTodo(todo)">

              <mat-icon>edit</mat-icon>

            </button>

            <button
              mat-mini-fab
              color="warn"
              (click)="onDeletetodo(todo.todoId)">

              <mat-icon>delete</mat-icon>

            </button>

          </div>

        </li>
      </ul>

      <ng-template #notodo>
        <p class="alert alert-info">
          No todos added yet
        </p>
      </ng-template>

    </div>

  </div>
</div>
